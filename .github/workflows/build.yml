name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: vgamepad sin instalador interactivo de ViGEmBus
        if: runner.os == 'Windows'
        run: python tools/ci_install_vgamepad.py
      - run: python -m pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes switch2pad tests
      - run: python -m pytest -q tests

  windows:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/ci_install_vgamepad.py
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean switch2pad.spec
      - name: Autoprueba del ejecutable
        shell: pwsh
        run: |
          $p = Start-Process dist\Switch2Pad.exe -ArgumentList "--selftest" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Switch2Pad-windows
          path: dist/Switch2Pad.exe

  linux:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    # Ubuntu 22.04 (glibc 2.35) para que el binario funcione en la mayoria de distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev gcc libgl1 libegl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcb-image0 libxcb-randr0 libxcb-xkb1
      - run: sh build_linux.sh
      - name: Autoprueba del ejecutable
        run: QT_QPA_PLATFORM=offscreen dist/Switch2Pad/switch2pad --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: Switch2Pad-linux
          path: dist/*.tar.gz
